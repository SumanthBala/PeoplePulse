spring.application.name=peoplepulse
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/peoplepulse_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PeoplePulse AI - keep the secret in the environment, never in source control
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

# Public React frontend URL. Override on the backend host if the Netlify domain changes.
app.frontend-url=${FRONTEND_URL:https://employeepls.netlify.app}
